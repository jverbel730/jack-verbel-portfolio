<style>
:root{
      /* forest green on white */
      --bg: oklch(100% 0 0);
      --surface: oklch(100% 0 0);
      --panel: oklch(100% 0 0);
      --border: oklch(88% 0.014 150);
      --text: oklch(21% 0.016 150);
      --text-muted: oklch(46% 0.017 150);
      --p-deep: oklch(31% 0.075 152);
      --p-main: oklch(42% 0.098 150);
      --p-mid: oklch(55% 0.095 148);
      --p-soft: oklch(72% 0.075 146);
      --p-light: oklch(89% 0.042 145);
      --plate: oklch(100% 0 0);
      --plate-ink: oklch(21% 0.016 150);
      --plate-edge: oklch(88% 0.014 150);
      --mote: oklch(58% 0.095 148);
      --btn-ink: oklch(99% 0 0);
      --grad: linear-gradient(90deg, var(--p-deep), var(--p-main), var(--p-mid), var(--p-soft));
      --font-display: 'Poppins', sans-serif;
      --font-body: 'Poppins', sans-serif;
    }
    *{ box-sizing:border-box; }
    body{ margin:0; background:var(--bg); font-family:var(--font-body); text-wrap:pretty; }
    a{ color:var(--p-main); }
    a:hover{ color:var(--p-deep); }
    /* orbit field: wireframe planets running elliptical paths behind everything */
    .orbits{ position:absolute; inset:0; z-index:-1; overflow:hidden; pointer-events:none; }
    .orb{ position:absolute; color:var(--p-main); }
    .orb > svg{ display:block; overflow:visible; }
    .orb i{ position:absolute; left:0; top:0; display:block; }
    .orb i svg{ width:100%; height:100%; display:block; }
    .orb .planet{ offset-rotate:0deg; animation:orbitRun var(--t,80s) linear infinite; animation-delay:var(--dl,0s); will-change:offset-distance; }
    @keyframes orbitRun{ from{ offset-distance:0%; } to{ offset-distance:100%; } }
    @media (prefers-reduced-motion: reduce){ .orb .planet{ animation:none; offset-distance:18%; } }
    @media (max-width: 640px){ .orbits{ opacity:.6; } }
    .wrap{ max-width:1280px; margin:0 auto; padding:0 80px; }
    .badge{ font-family:var(--font-body); font-size:12px; font-weight:700; padding:7px 16px; border-radius:999px; background:#fff; border:1.5px solid var(--p-light); }
    .step{ display:flex; flex-direction:column; gap:10px; }
    .step-num{ font-family:var(--font-display); font-weight:800; font-size:15px; }
    .section-title{ font-family:var(--font-display); font-weight:800; font-size:32px; color:var(--p-main); margin:14px 0 12px 0; }
    .eyebrow{ font-family:var(--font-body); font-size:13px; font-weight:700; letter-spacing:1.2px; color:var(--p-main); text-transform:uppercase; }
    .card{ background:var(--panel); border:1px solid var(--border); border-radius:20px; }
    .concept-img{ width:100%; height:220px; background:var(--plate); display:flex; align-items:center; justify-content:center; overflow:hidden; border-radius:19px 19px 0 0; }
    .concept-img img{ width:100%; height:100%; object-fit:contain; }
    .lede{ font-family:var(--font-body); font-size:16px; line-height:1.7; color:var(--text-muted); margin:0 0 32px 0; max-width:760px; }
</style>

  <script>
  (function () {
    var box = document.getElementById('vaultdata');
    var d = JSON.parse(box.textContent);
    var form = document.getElementById('lockform');
    var input = document.getElementById('lockpw');
    var msg = document.getElementById('lockmsg');
    var KEY = 'jv-movado';

    function bytes(b64) {
      var s = atob(b64), a = new Uint8Array(s.length);
      for (var i = 0; i < s.length; i++) a[i] = s.charCodeAt(i);
      return a;
    }

    function unlock(pw) {
      var enc = new TextEncoder();
      return crypto.subtle.importKey('raw', enc.encode(pw), 'PBKDF2', false, ['deriveKey'])
        .then(function (base) {
          return crypto.subtle.deriveKey(
            { name: 'PBKDF2', salt: bytes(d.s), iterations: d.n, hash: 'SHA-256' },
            base, { name: 'AES-GCM', length: 256 }, false, ['decrypt']);
        })
        .then(function (key) {
          return crypto.subtle.decrypt({ name: 'AES-GCM', iv: bytes(d.i) }, key, bytes(d.c));
        })
        .then(function (buf) { return new TextDecoder().decode(buf); });
    }

    function reveal(html, pw) {
      var vault = document.getElementById('vault');
      vault.innerHTML = html;
      var lw = document.getElementById('lockwrap');
      if (lw) lw.parentNode.removeChild(lw);
      box.parentNode.removeChild(box);
      if (window.__wirePops) window.__wirePops(vault);
      var vids = vault.querySelectorAll('video');
      for (var i = 0; i < vids.length; i++) { var pr = vids[i].play(); if (pr && pr.catch) pr.catch(function () {}); }
      try { sessionStorage.setItem(KEY, pw); } catch (e) {}
    }

    form.addEventListener('submit', function (e) {
      e.preventDefault();
      var pw = input.value;
      if (!pw) return;
      msg.textContent = 'Unlocking\u2026';
      unlock(pw).then(function (html) { reveal(html, pw); })
        .catch(function () { msg.textContent = 'That password is not right.'; input.select(); });
    });

    try {
      var saved = sessionStorage.getItem(KEY);
      if (saved) unlock(saved).then(function (html) { reveal(html, saved); }).catch(function () {});
    } catch (e) {}
  })();
  </script>
