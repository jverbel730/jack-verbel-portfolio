<style>
:root{
      /* forest green on white */
      --bg: oklch(100% 0 0);
      --surface: oklch(100% 0 0);
      --panel: oklch(100% 0 0);
      --border: oklch(88% 0.014 150);
      --text: oklch(21% 0.016 150);
      --text-muted: oklch(46% 0.017 150);
      --p-deep: oklch(31% 0.075 152);
      --p-main: oklch(42% 0.098 150);
      --p-mid: oklch(55% 0.095 148);
      --p-soft: oklch(72% 0.075 146);
      --p-light: oklch(89% 0.042 145);
      --plate: oklch(100% 0 0);
      --plate-ink: oklch(21% 0.016 150);
      --plate-edge: oklch(88% 0.014 150);
      --mote: oklch(58% 0.095 148);
      --btn-ink: oklch(99% 0 0);
      --grad: linear-gradient(90deg, var(--p-deep), var(--p-main), var(--p-mid), var(--p-soft));
      --font-display: 'Poppins', sans-serif;
      --font-body: 'Poppins', sans-serif;
    }
    *{ box-sizing:border-box; }
    body{ margin:0; background:var(--bg); font-family:var(--font-body); text-wrap:pretty; }
    a{ color:var(--p-main); }
    a:hover{ color:var(--p-deep); }
    .wrap{ max-width:1280px; margin:0 auto; padding:0 80px; }
</style>
<link rel="stylesheet" href="/styles.css">
</head>
<body>
<div style="width:100%; background:var(--bg); overflow:hidden; position:relative; isolation:isolate; min-height:100vh; display:flex; flex-direction:column;">
  


  <div style="height:5px; background:var(--grad);"></div>

  <nav style="display:flex; align-items:center; justify-content:space-between; padding:0 80px; height:88px; border-bottom:1px solid var(--border);">
    <a href="/" style="font-family:var(--font-display); font-weight:800; font-size:20px; color:var(--text); text-decoration:none;">Jack<span style="color:var(--p-main);">.</span>Verbel</a>
    <div style="display:flex; align-items:center; gap:40px;">
      <a href="/" style="font-family:var(--font-body); font-weight:700; font-size:14px; text-decoration:none; color:var(--text-muted); border-bottom:3px solid transparent; padding-bottom:28px;">Work</a>
      <a href="/about" style="font-family:var(--font-body); font-weight:700; font-size:14px; text-decoration:none; color:var(--text-muted); border-bottom:3px solid transparent; padding-bottom:28px;">About</a>
      <a href="/contact" style="font-family:var(--font-body); font-weight:700; font-size:14px; text-decoration:none; color:var(--text); border-bottom:3px solid var(--p-main); padding-bottom:28px;">Contact</a>
    </div>
  </nav>

  <section style="flex:1; display:flex; align-items:center; padding:100px 0; background:transparent;">
    <div class="wrap" style="width:100%;">
      <span style="font-family:var(--font-body); font-size:13px; font-weight:700; letter-spacing:1.2px; color:var(--p-main); text-transform:uppercase;">Contact</span>
      <h1 style="font-family:var(--font-display); font-weight:800; font-size:60px; line-height:1.1; color:var(--p-main); margin:16px 0 40px 0;" data-pop="mail">Let's Talk<br>Design</h1>

      <a href="mailto:Jverbel730@gmail.com" style="display:inline-block; font-family:var(--font-display); font-weight:700; font-size:30px; color:var(--text); text-decoration:none; border-bottom:4px solid var(--p-main); padding-bottom:8px; margin-bottom:56px;" data-pop="mail">Jverbel730@gmail.com</a>

      <div style="display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:24px; max-width:940px;">
        <div style="background:var(--panel); border:1px solid var(--border); border-radius:16px; padding:20px 24px;">
          <div style="font-family:var(--font-body); font-size:12px; font-weight:700; letter-spacing:0.5px; color:var(--p-main); text-transform:uppercase; margin-bottom:8px;" data-pop="phone">Phone</div>
          <div style="font-family:var(--font-body); font-size:18px; color:var(--text); font-weight:600;">(908) 415-1964</div>
        </div>
        <div style="background:var(--panel); border:1px solid var(--border); border-radius:16px; padding:20px 24px;">
          <div style="font-family:var(--font-body); font-size:12px; font-weight:700; letter-spacing:0.5px; color:var(--p-deep); text-transform:uppercase; margin-bottom:8px;" data-pop="pin">Location</div>
          <div style="font-family:var(--font-body); font-size:18px; color:var(--text); font-weight:600;" data-pop="pin">Middletown, New Jersey</div>
        </div>
        <div style="background:var(--panel); border:1px solid var(--border); border-radius:16px; padding:20px 24px;">
          <div style="font-family:var(--font-body); font-size:12px; font-weight:700; letter-spacing:0.5px; color:var(--p-mid); text-transform:uppercase; margin-bottom:8px;" data-pop="linkedin">LinkedIn</div>
          <a href="https://www.linkedin.com/in/jack-verbel-5a95a12a8/" target="_blank" rel="noopener" style="font-family:var(--font-body); font-size:18px; color:var(--p-main); font-weight:600; text-decoration:none;">Jack Verbel &rarr;</a>
        </div>
      </div>
    </div>
  </section>

  <footer style="border-top:1px solid var(--border); padding:32px 80px; display:flex; align-items:center; justify-content:space-between; font-family:var(--font-body); font-size:13px; color:var(--text-muted);">
    <div>&copy; 2026 Jack Verbel</div>
    <div style="display:flex; gap:24px; align-items:center;">
      <a href="mailto:Jverbel730@gmail.com" style="color:var(--p-main); text-decoration:none; font-weight:600;">Jverbel730@gmail.com</a>
      <a href="https://www.linkedin.com/in/jack-verbel-5a95a12a8/" target="_blank" rel="noopener" style="color:var(--p-main); text-decoration:none; font-weight:600;">LinkedIn</a>
      <span>Middletown, New Jersey</span>
    </div>
  </footer>

</div>
